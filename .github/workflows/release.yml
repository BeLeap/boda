name: Release Binaries

on:
  workflow_dispatch:

concurrency:
  group: boda-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare and publish crate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.commit.outputs.commit }}
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt

      - name: Select release version
        id: version
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          current_version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n 1)"
          latest_tag="$(git tag --list '0.*' --sort=-version:refname | head -n 1)"
          head_commit="$(git rev-parse HEAD)"
          version=""

          if [[ -n "$latest_tag" && "$current_version" != "$latest_tag" ]]; then
            version="$current_version"
          elif [[ -n "$latest_tag" ]] \
            && [[ "$(git rev-parse "${latest_tag}^{commit}")" == "$head_commit" ]]; then
            release_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${current_version}")"

            case "$release_status" in
              200) version="$(./scripts/version.sh head=0)" ;;
              404) version="$current_version" ;;
              *) echo "Unexpected GitHub release lookup status: ${release_status}" >&2; exit 1 ;;
            esac
          else
            version="$(./scripts/version.sh head=0)"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version from scripts/version.sh: ${version}" >&2
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Selected release version: ${version}"

      - name: Update package versions
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]

          def replace_once(path: str, pattern: str, replacement: str) -> None:
              file = Path(path)
              text = file.read_text()
              updated, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f"Expected one version field in {path}, found {count}")
              file.write_text(updated)

          replace_once(
              "Cargo.toml",
              r'(?m)^version = "[^"]+"$',
              f'version = "{version}"',
          )
          replace_once(
              "flake.nix",
              r'(?m)^([ \t]+version = ")[^"]+(";)[ \t]*$',
              rf'\g<1>{version}\g<2>',
          )
          PY

      - name: Test and update lockfile
        run: |
          cargo check --all-targets
          cargo test --locked
          cargo fmt --all -- --check
          git diff --check

      - name: Commit release version
        id: commit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock flake.nix
          if ! git diff --cached --quiet; then
            git commit -m "Release ${{ steps.version.outputs.version }}"
          fi
          git push origin "HEAD:${DEFAULT_BRANCH}"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate package contents
        run: cargo package --locked --list > /dev/null

      - name: Check crates.io version
        id: registry
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            -H "User-Agent: boda-release/${VERSION} (https://github.com/BeLeap/boda)" \
            "https://crates.io/api/v1/crates/boda/${VERSION}")"
          case "$status" in
            200) echo 'exists=true' >> "$GITHUB_OUTPUT" ;;
            404) echo 'exists=false' >> "$GITHUB_OUTPUT" ;;
            *) echo "Unexpected crates.io response: ${status}" >&2; exit 1 ;;
          esac

      - name: Validate crate publication
        if: steps.registry.outputs.exists == 'false'
        run: cargo publish --locked --dry-run

      - name: Publish to crates.io
        if: steps.registry.outputs.exists == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish --locked

  build:
    name: Build ${{ matrix.target.triplet }}
    needs: prepare
    runs-on: ${{ matrix.target.runs-on }}
    strategy:
      matrix:
        target:
          - runs-on: ubuntu-latest
            triplet: x86_64-unknown-linux-gnu
          - runs-on: ubuntu-latest
            triplet: aarch64-unknown-linux-gnu
          - runs-on: macos-latest
            triplet: aarch64-apple-darwin

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target.triplet }}

      - name: Install Cross
        run: cargo install cross

      - name: Build binary
        run: cross build --locked --release --target ${{ matrix.target.triplet }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.triplet }}-binary
          path: target/${{ matrix.target.triplet }}/release/boda

  release:
    name: Create GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: '*-binary'

      - name: Compress release assets
        run: |
          set -euo pipefail
          for triplet in \
            x86_64-unknown-linux-gnu \
            aarch64-unknown-linux-gnu \
            aarch64-apple-darwin; do
            tar -czf "${triplet}-binary.tar.gz" "${triplet}-binary"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          target_commitish: ${{ needs.prepare.outputs.commit }}
          name: Boda ${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            x86_64-unknown-linux-gnu-binary.tar.gz
            aarch64-unknown-linux-gnu-binary.tar.gz
            aarch64-apple-darwin-binary.tar.gz
